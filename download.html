<!DOCTYPE html>
<html lang="en">
<head>
<title>Empanadas.io</title>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src https://empanadas.io; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="origin">
<meta name="application-name" content="Empanadas.io">
<meta name="msapplication-TileColor" content="#1e1e91">
<link rel="stylesheet" href="Content/CSS/splash.css">
<link rel="preload" as="image" href="Content/Images/jeff.gif">
</head>
<body>
<main class="stage">
	<div class="mark">
		<div class="glow"></div>
		<div class="float">
			<div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
			<img id="logo" src="Content/Images/logo.png" alt="">
		</div>
	</div>
	<h1 id="msg">Empanadas.io</h1>
	<div class="progress" role="progressbar" aria-label="Connecting"><span></span></div>
	<p id="status" role="status" aria-live="polite">Connecting...</p>
	<div id="offline" role="group" aria-labelledby="offlinenote">
		<div class="play-row" id="playrow">
			<button type="button" data-game="spin">Play Spin</button>
			<button type="button" data-game="flappy">Play Flappy</button>
		</div>
		<p id="offlinenote"></p>
	</div>
</main>
<script>
const app = window.electronWindow || null;

function ping(timeoutMs = 8000) {
	if (app && typeof app.ping === "function") {
		return app.ping().then(function(res) {
			if (!res || !res.ok) throw new Error("HTTP " + (res ? res.status : 0));
			return res.pong ? "Pong!" : "";
		});
	}
	const url = "https://empanadas.io/v2/ping.php?usingnativeapp=1&firsthello=1&_=" + Date.now();
	const abort = new AbortController();
	const timer = setTimeout(() => abort.abort(), timeoutMs);

	return fetch(url, { method: "GET", cache: "no-store", signal: abort.signal })
		.then((res) => {
			if (!res.ok) throw new Error("HTTP " + res.status);
			return res.text();
		})
		.finally(() => clearTimeout(timer));
}

let appid = localStorage.getItem("AppID");
if(appid == null) {
	appid = window.crypto.randomUUID();
	localStorage.setItem("AppID", appid);
}
const appbase = "https://empanadas.io/v2/dashboard";
const appparam = "?usingnativeapp=1";
const start = Date.now();
const logo = document.getElementById("logo");
const msg = document.getElementById("msg");
const status = document.getElementById("status");
const minwait = 1500;
let noint = false;
let leaving = false;

const query = new URLSearchParams(window.location.search);
const GAME_NAMES = { spin: "Spin", flappy: "Flappy" };
const failedGame = Object.prototype.hasOwnProperty.call(GAME_NAMES, query.get("game")) ? query.get("game") : null;

const failedBefore = query.get("failed") === "1";

const offlineBox = document.getElementById("offline");
const offlineNote = document.getElementById("offlinenote");
const playRow = document.getElementById("playrow");

function say(html) {
	if (status.innerHTML === html) return;
	status.innerHTML = html;
	status.classList.remove("changed");
	void status.offsetWidth; // so the animation starts again
	status.classList.add("changed");
}

let offered = null;
let offering = null;

function offerGames(reason) {
	if (!app || !app.offline || leaving || offered === reason || offering === reason) return;
	offering = reason;
	app.offline.status().then(function(state) {
		if (offering !== reason) return;
		offering = null;
		if (leaving || !state || (reason === "slow" && noint)) return;
		showOffer(reason, state);
	}).catch(function() {
		if (offering === reason) offering = null;
	});
}

function showOffer(reason, state) {
	if (reason === "slow" && !state.available) return;
	offered = reason;
	if (state.available) {
		playRow.style.display = null;
		if (reason === "slow") {
			offlineNote.textContent = "Taking a while? You can play offline while we keep trying.";
		} else {
			offlineNote.textContent = failedGame
				? GAME_NAMES[failedGame] + " couldn't load. Try again, or pick the other game."
				: "You can still play offline. Your progress is saved on this device and syncs when you're back online.";
		}
		document.body.classList.add("games");
	} else {
		playRow.style.display = "none";
		offlineNote.textContent = state.signedIn
			? "Connect once more to finish downloading the games for offline play."
			: "Sign in once while you're online, and you can play Spin and Flappy offline too.";
	}
	offlineBox.style.display = "block";
}

function hideOfflineGames() {
	offered = null;
	offering = null;
	offlineBox.style.display = "none";
	document.body.classList.remove("games");
}

function setButtons(enabled) {
	const buttons = playRow.querySelectorAll("button");
	for (let i = 0; i < buttons.length; i++) {
		buttons[i].disabled = !enabled;
		buttons[i].textContent = "Play " + GAME_NAMES[buttons[i].getAttribute("data-game")];
	}
}

playRow.addEventListener("click", function(e) {
	const button = e.target.closest("button[data-game]");
	if (!button || !app || !app.offline || leaving) return;
	leaving = true;
	clearTimeout(retryTimer);
	retryTimer = null;
	setButtons(false);
	button.textContent = "Loading...";
	const notStarted = function() {
		leaving = false;
		setButtons(true);
		offered = null;
		noInt();
	};
	app.offline.play(button.getAttribute("data-game")).then(function(started) {
		if (!started) notStarted();
	}, notStarted);
});

const noinmsg = "We were unable to talk to our empanada robots!<br>Double check that your beep-boop machines are on and within range.";
const RETRY_MS = 5000;
let retryTimer = null;
let retrying = false;

function noInt() {
	if (leaving) return;
	if(!noint) {
		noint = true;
		document.body.classList.add("offline");
		logo.src = "Content/Images/jeff.gif";
		logo.classList.add("swapped");
		msg.textContent = "Check Your Internet";
		say(noinmsg);
	}
	offerGames("offline");
	if (retryTimer === null && !retrying) retryTimer = setTimeout(retry, RETRY_MS);
}

function retry() {
	clearTimeout(retryTimer);
	retryTimer = null;
	if (retrying || leaving || !noint) return;
	retrying = true;
	ping().then(function() {
		retrying = false;
		if (leaving) return;
		noint = false;
		hideOfflineGames();
		say("Connected!");
		finishedLoading("&retried_network=1", true);
	}).catch(function() {
		retrying = false;
		noInt();
	});
}

function finishedLoading(params="", force=false) {
	if (leaving) return;
	if(!force && (!navigator.onLine || noint)) {
		noInt();
		return;
	}
	leaving = true;
	clearTimeout(retryTimer);
	retryTimer = null;
	setButtons(false);
	const wait = Math.max(0, minwait - (Date.now() - start));
	setTimeout(function() {
		document.body.classList.add("ready");
		setTimeout(function() {
			document.body.classList.add("leaving");
			setTimeout(function() {
				console.log("GO: " + params);
				window.location.href = appbase+appparam+params+"&appid="+encodeURIComponent(appid);
			}, 280);
		}, 240);
	}, wait);
}

function download() {
	if(navigator.onLine === false || failedBefore) {
		noInt();
		return;
	}
	const slow = setTimeout(function() {
		if (!noint && !leaving) say("Waiting for Server...");
	}, 2500);
	const slower = setTimeout(function() {
		if (!noint && !leaving) offerGames("slow");
	}, 4000);

	ping().then(function(data) {
		if(data == "Pong!") {
			say("");
			finishedLoading("&sucessfulstart=1");
		}
	}).catch(function() {
		noInt();
	}).finally(function() {
		clearTimeout(slow);
		clearTimeout(slower);
	});
}

setTimeout(function(){
	if(navigator.onLine && !noint) {
		finishedLoading("&forceapptimeout=1");
	}
}, 10000);

window.addEventListener("offline", function() {
	noInt();
});
window.addEventListener("online", function() {
	retry();
});

download();
</script>
</body>
</html>
