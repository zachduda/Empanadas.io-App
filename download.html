<html>
<head>
<title>Empanadas.io</title>
<meta charset="utf-8">
<!-- This page ships inside the app, so everything it needs is local except the
     ping to empanadas.io. Locking it down means an injected <script src> or a
     redirected asset has nothing to load from. Note: re-enabling the remote
     startup.js at the bottom of this file would need its origin added to
     script-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src https://empanadas.io; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="origin">
<meta name="application-name" content="Empanadas.io">
<meta name="msapplication-TileColor" content="#1e1e91">
<style>
@font-face {
    font-family: Poppins;
    src: url(Poppins.ttf) format("truetype");
}

* {
	text-align: center;
    font-family: poppins,sans-serif;
	overflow: hidden;
	user-select: none;
	transition: 0.5s all ease;
}
html, body {
	background-color: #1e1e91;
	color: white;
	font-size:32px;
	height: 100%;
}
img {
  display: block;
  margin-left: auto;
  margin-right: auto;
  width: 20%;
  margin-top: 180px;
}

footer p {
	margin-bottom: 10px;
	font-size: 18px;
	padding-left: 10%;
	padding-right: 10%;
	font-weight:300;
	color:#abbefc;
}
</style>
<!-- No crossorigin attribute: this is a local file loaded from a file:// page,
     and asking for a CORS fetch of it makes Chromium block the stylesheet
     outright ("Cross origin requests are only supported for protocol schemes:
     ... http, https"). The attribute was silently killing every animation on
     this page. -->
<link rel="stylesheet" href="Content/CSS/animated.css">
</head>
<body>
<img class="animated fadeIn faster" style="animation-delay:250ms" id="logo" src="Content/Images/logo.png"></img>
<div class="animated fadeInUp" style="animation-delay:500ms;margin-top:20px;font-weight:1000;" id="msg">Empanadas.io</div>
<footer>
<p class="animated fadeInUp" style="animation-delay:525ms;" id="status">Communicating to Server...</p>
</footer>
<script>
// This page used to load jQuery 3.5.1 for two identical $.ajax calls. Chromium
// has had fetch() for a decade, so the dependency bought nothing and cost a
// 90 KB file that would need watching for advisories forever.
//
// The one behaviour worth keeping from $.ajax is `cache: false`, which appends
// a changing query parameter so a cached 200 cannot stand in for the server
// actually being reachable. The timeout is new: fetch() without one waits as
// long as the OS lets it, which on a captive portal is a very long time.
function ping(timeoutMs = 10000) {
	const url = "https://empanadas.io/v2/ping.php?usingnativeapp=1&firsthello=1&_=" + Date.now();
	const abort = new AbortController();
	const timer = setTimeout(() => abort.abort(), timeoutMs);

	return fetch(url, { method: "GET", cache: "no-store", signal: abort.signal })
		.then((res) => {
			if (!res.ok) throw new Error("HTTP " + res.status);
			return res.text();
		})
		.finally(() => clearTimeout(timer));
}

// On a first run this used to store the new ID but leave `appid` undefined, so
// the very first dashboard load went out as "&appid=undefined".
let appid = localStorage.getItem("AppID");
if(appid == null) {
	appid = window.crypto.randomUUID();
	localStorage.setItem("AppID", appid);
}
const appbase = "https://empanadas.io/v2/dashboard";
const appparam = "?usingnativeapp=1";
const start = Date.now();
const logo = document.getElementById("logo");
const msg = document.getElementById("msg");
const status = document.getElementById("status");
const minwait = 2250;
let noint = false;
function noInt() {
	allowdownload = true;
	let noinmsg = "We were unable to talk to our empanada robots!<br>Double check that your beep-boop machines are on and within range.";
	if(!noint) {
		logo.src = "Content/Images/jeff.gif";
		logo.style.marginTop = "120px";
		msg.innerHTML = "Check Your Internet";
		status.innerHTML = noinmsg;
	}
	noint = true;
	setTimeout(function(){
		ping().then(function() {
			noint = false;
			status.innerHTML = "Connected!";
			finishedLoading("&retried_network=1", true);
		}).catch(function() {
			status.innerHTML = noinmsg;
			noInt();
		});
	}, 5000);
}
function finishedLoading(params="", force=false) {
	if((navigator.onLine && !noint) || force) {
		allowdownload = false;
		const end = Date.now();	
		setTimeout(function(){ 
			setTimeout(function(){ 
				if(!navigator.onLine && !force) {
					noInt();
					return;
				}
				msg.style.display = "none";
				logo.style.display = "none";
				status.style.display = "none";
				msg.classList.remove("animated", "fadeOut", "faster");
				logo.classList.remove("animated", "fadeOut", "faster");
				status.classList.remove("animated", "fadeOut", "faster");
				console.log("GO: " + params);
				window.location.href = appbase+appparam+params+"&appid="+encodeURIComponent(appid);
			}, 480);
			logo.classList.remove("animated", "fadeIn", "faster");
			msg.classList.remove("animated", "fadeInUp");
			status.classList.remove("animated", "fadeInUp");
			logo.style.animationDelay = "0s";
			msg.style.animationDelay = "0s";
			status.style.animationDelay = "0s";
			setTimeout(function(){ 
			msg.classList.add("animated", "fadeOut", "faster");
			logo.classList.add("animated", "fadeOut", "faster");
			status.classList.add("animated", "fadeOut", "faster");
			}, 250);
		}, minwait-(end-start));
	} else {
		noInt();
	}
}

let allowdownload = true;
let downloaded = 0;
let canFinish = false;
let downloadsDone = false;
function download(ds) {
	if(!navigator.onLine || noint) { allowdownload = false; noInt(); return; }
	if(!allowdownload) { return; }
	
	status.innerHTML = "Waiting for Server...";

	ping().then(function(data) {
		// Anything other than "Pong!" is left alone deliberately: the 10 second
		// timer below is the fallback, same as before.
		if(data == "Pong!") {
			canFinish = true;
			downloadsDone = true;
			logo.style.marginTop = "200px";
			status.innerHTML = "";
			finishedLoading("&sucessfulstart=1");
		}
	}).catch(function() {
		allowdownload = false;
		noInt();
	});
}

setTimeout(function(){
	if(navigator.onLine && !noint) {
		finishedLoading("&forceapptimeout=1");
	}
}, 10000);

download(null);
</script>

<!--<script src="https://api.empanadas.io/app/startup.js" onerror="noInt()"></script>-->
</body>
</html>
