# XcodeGen spec for the iOS app. The .xcodeproj is generated from this file
# and not checked in:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Empanadas.xcodeproj
#
# See ios/README.md.
name: Empanadas

options:
  bundleIdPrefix: io.empanadas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 6: data races are compile errors, and what runs on the main
    # actor is checked.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The Apple Developer Team ID, for signing. The site's
    # apple-app-site-association names the app by it (MWBT4TC7JN.io.empanadas.app),
    # so passkeys only work in a build signed by this team.
    DEVELOPMENT_TEAM: "MWBT4TC7JN"
    CODE_SIGN_STYLE: Automatic

targets:
  Empanadas:
    type: application
    platform: iOS
    sources:
      - path: Empanadas
        excludes:
          - Resources/bridge.js
      # Injected into the web views at runtime, so it ships as a resource
      # rather than being treated as source.
      - path: Empanadas/Resources/bridge.js
        buildPhase: resources
      # What the app tells the widget (GamesSnapshot), in both.
      - path: Shared
    dependencies:
      # The Home Screen widget, embedded in the app.
      - target: EmpanadasWidget
    settings:
      base:
        PRODUCT_NAME: Empanadas
        PRODUCT_BUNDLE_IDENTIFIER: io.empanadas.app
        INFOPLIST_FILE: Empanadas/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Empanadas/Resources/Empanadas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - EmpanadasTests

  # The Home Screen widget (EmpanadasWidget/GamesWidget.swift). It shares an
  # App Group with the app, which writes what it shows there.
  EmpanadasWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EmpanadasWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: EmpanadasWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.empanadas.app.widget
        INFOPLIST_FILE: EmpanadasWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: EmpanadasWidget/EmpanadasWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  EmpanadasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpanadasTests
    dependencies:
      - target: Empanadas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.empanadas.app.tests
