# XcodeGen spec for the iOS app. The .xcodeproj is generated from this file
# and not checked in:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Empanadas.xcodeproj
#
# See ios/README.md.
name: Empanadas

options:
  bundleIdPrefix: io.empanadas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Your Apple Developer Team ID, for signing. Leave empty to pick it in
    # Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Empanadas:
    type: application
    platform: iOS
    sources:
      - path: Empanadas
        excludes:
          - Resources/bridge.js
      # Injected into the web views at runtime, so it ships as a resource
      # rather than being treated as source.
      - path: Empanadas/Resources/bridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Empanadas
        PRODUCT_BUNDLE_IDENTIFIER: io.empanadas.app
        INFOPLIST_FILE: Empanadas/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Empanadas/Resources/Empanadas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - EmpanadasTests

  EmpanadasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpanadasTests
    dependencies:
      - target: Empanadas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.empanadas.app.tests
