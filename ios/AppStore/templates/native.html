<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Native screens</title>
<!--
  The app's native screens, drawn in HTML for the App Store screenshots:
  Home (HomeView.swift), Home scrolled to Spin Progress and Friends, the
  Games tab (GamesView.swift; on iPad with a card's menu open, GameMenu.swift),
  the Leaderboard (LeaderboardView.swift), and the Home Screen widgets
  (EmpanadasWidget/GamesWidget.swift), with demo data. Sizes, colours and
  wording follow the SwiftUI code and Palette in Components.swift. Rendered by
  render.mjs at 440x956 (iPhone 6.9") and 1032x1376 (iPad 13"); the widgets
  on their own, on a clear background, for the screenshot to float.

  ?screen=home|friends|games|leaderboard|widgets  &device=phone|pad
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<script src="icons.js"></script>
<style>
  :root {
    --bg: #F2F2F7;            /* systemGroupedBackground */
    --card: #FFFFFF;          /* secondarySystemGroupedBackground */
    --label: #000;
    --secondary: rgba(60, 60, 67, 0.6);
    --tertiary: rgba(60, 60, 67, 0.3);
    --separator: rgba(60, 60, 67, 0.18);
    --fill: rgba(120, 120, 128, 0.12);
    --accent: #3756E9;
    --brand: #1E1E91;
    --spin: #2E82EF; --flappy: #17A673; --tower: #E0891B; --friends: #7952B3;
    --peppers: #D9534F; --experience: #2DD67F; --chart: #4FB9FF; --pumpkin: #F08000;
    --online: #2DD67F; --idle: #F0AD4E;
    --gold: #F5B301; --silver: #A7B1BC; --bronze: #C8834B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 17px; letter-spacing: -0.2px; color: var(--label);
    -webkit-font-smoothing: antialiased; position: relative;
  }
  .ico { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* Status bar, on the Dynamic Island's centre line (11pt down, 37pt tall), the
     time centred in the room to its left and the icons in the room to its right */
  .status { position: absolute; left: 0; right: 0; top: 0; height: 59px; z-index: 30; display: flex; align-items: center;
    justify-content: space-between; padding: 0 40px 0 59px; font-weight: 600; font-size: 17px; letter-spacing: -0.3px; }
  .status .right { display: flex; gap: 7px; align-items: center; }
  .pad .status { height: 32px; padding: 0 22px 0 26px; font-size: 14px; }
  .pad .status .date { font-weight: 600; margin-left: 6px; }

  /* Navigation bar: the large title, then the inline one once scrolled */
  .nav { position: absolute; left: 0; right: 0; top: 0; z-index: 20; }
  .nav .bar { height: 106px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 16px 6px; }
  /* The toolbar's glass: the items on one side share a capsule (iOS 26) */
  .nav .glass { height: 44px; border-radius: 22px; display: flex; align-items: center;
    background: rgba(255,255,255,0.72); box-shadow: 0 1px 6px rgba(0,0,0,0.08), inset 0 0 0 0.5px rgba(0,0,0,0.06);
    backdrop-filter: blur(10px); }
  .nav .glass > * { width: 40px; height: 44px; display: grid; place-items: center; position: relative; }
  .nav .glass { padding: 0 2px; }
  .nav .glass .text { width: auto; padding: 0 14px; font-size: 17px; font-weight: 500; }
  .bell { font-size: 19px; color: #1c1c1e; }
  .bell .badge { position: absolute; top: 10px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #FF3B30;
    box-shadow: 0 0 0 1.5px #fff; }
  .nav h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.2px; padding: 2px 16px 10px; line-height: 41px; }
  .nav.inline { background: linear-gradient(to bottom, rgba(242,242,247,0.96) 70%, rgba(242,242,247,0)); }
  .nav.inline .bar { justify-content: center; align-items: flex-end; height: 106px; padding-bottom: 16px; position: relative; }
  .nav.inline .bar .title { font-size: 17px; font-weight: 600; }
  .nav.inline .bar .glass { position: absolute; right: 16px; bottom: 6px; }
  .pad .nav .bar { height: 32px; }
  .pad .nav h1 { padding: 76px 24px 10px; }
  .pad .nav .glass { position: absolute; top: 41px; right: 24px; }

  /* Tab bar: iOS 26's floating glass bar on iPhone, the tab strip on top on iPad.
     Headless Chromium skips a backdrop blur much past 10px and leaves what's
     behind sharp, so the glass keeps to 10px. */
  .tabbar { position: absolute; z-index: 25; display: flex; align-items: center; }
  .phone .tabbar { left: 21px; right: 21px; bottom: 22px; height: 62px; border-radius: 31px; padding: 4px;
    background: rgba(250,250,252,0.72); backdrop-filter: blur(10px) saturate(1.6);
    box-shadow: 0 8px 30px rgba(0,0,0,0.12), inset 0 0 0 0.5px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.9); }
  .phone .tab { flex: 1; height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; font-weight: 600; color: #1c1c1e; letter-spacing: 0; }
  .phone .tab .ico { font-size: 21px; }
  .phone .tab.on { background: rgba(120,120,128,0.13); color: var(--accent); }
  .pad .tabbar { top: 38px; left: 50%; transform: translateX(-50%); height: 50px; border-radius: 25px; padding: 4px; gap: 2px;
    background: rgba(250,250,252,0.72); backdrop-filter: blur(10px) saturate(1.6);
    box-shadow: 0 6px 24px rgba(0,0,0,0.1), inset 0 0 0 0.5px rgba(0,0,0,0.08); }
  .pad .tab { height: 42px; padding: 0 20px; border-radius: 21px; display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; color: #1c1c1e; }
  .pad .tab .ico { font-size: 16px; }
  .pad .tab.on { background: rgba(120,120,128,0.14); color: var(--accent); }
  .homeind { position: absolute; z-index: 40; bottom: 8px; left: 50%; transform: translateX(-50%); width: 146px; height: 5px;
    border-radius: 3px; background: #000; }
  .pad .homeind { width: 320px; bottom: 7px; }

  /* Content */
  .scroll { position: absolute; left: 0; right: 0; top: 159px; padding: 0 16px; }
  .pad .scroll { top: 166px; padding: 0 24px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card-h { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 600; }
  .card-h .ico { margin-right: 4px; }
  .card-h .aside { margin-left: auto; font-size: 15px; font-weight: 400; color: var(--secondary); }

  .hero { border-radius: 24px; padding: 20px; color: #fff; display: flex; flex-direction: column; gap: 16px;
    background: linear-gradient(135deg, var(--brand), #4A5BF0); }
  .hero .top { display: flex; gap: 16px; align-items: center; }
  .hero h2 { font-size: 22px; font-weight: 700; letter-spacing: 0; }
  .hero p { font-size: 15px; opacity: 0.85; margin-top: 4px; line-height: 20px; }
  .hero .btns { display: flex; gap: 10px; }
  .hero .btn { font-size: 15px; font-weight: 600; padding: 9px 14px; border-radius: 99px; background: rgba(255,255,255,0.18);
    display: flex; gap: 6px; align-items: center; }

  .avatar { border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden;
    font-family: "Apple Color Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }

  /* BalancedGrid: its columns are worked out once laid out (balance()) */
  .balanced { display: grid; }
  .tiles { gap: 12px; }
  .tile { background: var(--card); border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center; }
  .tile .badge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 17px; flex: none; }
  .tile b { font-size: 17px; font-weight: 600; display: block; line-height: 21px; }
  .tile b span { color: var(--secondary); font-weight: 600; }
  .tile small { font-size: 12px; color: var(--secondary); display: block; }

  .cards { gap: 16px; }
  .rows { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .rows div { display: flex; justify-content: space-between; }
  .rows span { color: var(--secondary); }
  .rows b { font-weight: 600; }
  .meter { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.08); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }
  .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); }
  .play { margin-left: auto; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .play .ico { font-size: 11px; }

  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; font-size: 13px; font-weight: 500; }
  .seg div { flex: 1; text-align: center; padding: 6px 0; border-radius: 7px; }
  .seg .on { background: #fff; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04); }

  .friend { display: flex; gap: 12px; align-items: center; padding: 4px 0; }
  .friend .who { flex: 1; }
  .friend .who b { display: block; font-size: 15px; font-weight: 600; }
  .friend .who small { font-size: 12px; color: var(--secondary); }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .pending { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--friends); padding: 12px;
    border-radius: 12px; background: rgba(121,82,179,0.12); }
  .bordered { text-align: center; font-size: 15px; font-weight: 500; color: var(--accent); background: var(--fill);
    border-radius: 99px; padding: 8px; }

  /* Leaderboard: an inset grouped list */
  .pad .lb { max-width: 720px; margin: 0 auto; }  /* readableListWidth() */
  .lb .seg { margin: 0 0 14px; font-size: 14px; }
  .lb .seg div { padding: 7px 0; }
  .sechead { display: flex; justify-content: space-between; text-transform: uppercase; font-size: 13px; color: var(--secondary);
    padding: 0 16px 7px; letter-spacing: 0; }
  .list { background: var(--card); border-radius: 26px; overflow: hidden; }
  .lrow { display: flex; gap: 12px; align-items: center; padding: 8px 16px; min-height: 64px; position: relative; }
  .lrow + .lrow::before { content: ""; position: absolute; top: 0; left: 112px; right: 0; height: 0.5px; background: var(--separator); }
  .lrow.you { background: rgba(46,130,239,0.14); }
  .rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 800;
    color: var(--secondary); font-variant-numeric: tabular-nums; flex: none; }
  .rank.medal { color: #fff; }
  .lrow .who { flex: 1; min-width: 0; }
  .lrow .who b { font-size: 17px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .lrow .who small { font-size: 12px; color: var(--secondary); white-space: nowrap; }
  .youtag { font-size: 11px; font-weight: 700; color: #fff; background: var(--spin); padding: 2px 6px; border-radius: 99px; }
  .score { text-align: right; }
  .score b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score small { font-size: 11px; color: var(--secondary); }
  .lrow .chev { color: var(--tertiary); font-size: 13px; margin-left: 4px; }
  .secfoot { font-size: 13px; color: var(--secondary); padding: 7px 16px 0; }

  .chart { height: 220px; position: relative; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sum { display: flex; justify-content: space-between; align-items: baseline; }
  .sum b { font-size: 22px; font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
  .sum small { font-size: 12px; color: var(--secondary); }
  .sum .gain { text-align: right; }
  .sum .gain b { font-size: 17px; font-weight: 600; color: var(--flappy); }
  .xp { display: flex; gap: 8px; font-size: 20px; font-weight: 600; align-items: center; }
  .xp .e { font-family: "Apple Color Emoji", "Noto Color Emoji", sans-serif; }

  /* Games tab: Jump Back In, a card a game, then the links */
  .jump { background: var(--card); border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; }
  .jump .jicon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-size: 23px; flex: none; }
  .jump .jtxt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .jump .kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--secondary); letter-spacing: 0; }
  .jump b { font-size: 17px; font-weight: 600; line-height: 22px; }
  .jump small { font-size: 12px; color: var(--secondary); }
  .jump .jplay { font-size: 15px; font-weight: 700; color: #fff; padding: 9px 16px; border-radius: 99px; display: flex; gap: 6px; align-items: center; }
  .jump .jplay .ico { font-size: 12px; }

  .games { gap: 16px; }
  .gcard { position: relative; overflow: hidden; isolation: isolate; border-radius: 22px; padding: 16px; color: #fff;
    display: flex; flex-direction: column; gap: 14px; }
  .gshade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom right, rgba(255,255,255,0.14), rgba(0,0,0,0.2)); }
  .gmark { position: absolute; z-index: -1; right: -28px; bottom: -22px; font-size: 124px; opacity: 0.1; transform: rotate(-14deg); }
  .gmark .ico { display: block; }
  .ghead { display: flex; gap: 14px; align-items: flex-start; }
  .gicon { width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.2); display: grid; place-items: center;
    font-size: 25px; flex: none; }
  .gtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .gtitle b { font-size: 20px; font-weight: 700; line-height: 25px; }
  .gtitle small { font-size: 13px; line-height: 18px; opacity: 0.85; }
  .gplay { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 14px;
    flex: none; margin-left: 8px; padding-left: 2px; }
  .gbadges { display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px;
    background: rgba(255,255,255,0.2); white-space: nowrap; }
  .pill .ico { font-size: 11px; }
  .gnums { display: flex; align-items: center; padding: 10px 4px; border-radius: 14px; background: rgba(0,0,0,0.14); margin-top: auto; }
  .gnums > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gnums b { font-size: 17px; font-weight: 600; line-height: 22px; font-variant-numeric: tabular-nums; }
  .gnums small { font-size: 11px; font-weight: 500; line-height: 13px; opacity: 0.85; }
  .gnums > i { width: 1px; height: 28px; background: rgba(255,255,255,0.25); flex: none; }

  .links { background: var(--card); border-radius: 20px; padding: 0 16px; }
  .link { display: flex; gap: 12px; align-items: center; padding: 12px 0; position: relative; }
  .link + .link::before { content: ""; position: absolute; top: 0; left: 48px; right: 0; height: 0.5px; background: var(--separator); }
  .link .licon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 17px; flex: none; }
  .link .ltxt { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .link b { font-size: 17px; font-weight: 600; line-height: 22px; }
  .link small { font-size: 12px; color: var(--secondary); }
  .link .chev { color: var(--tertiary); font-size: 12px; }

  /* A card held: the screen blurred behind it, the card lifted, its menu
     under it. The status bar stays sharp, as it does in iOS. */
  .held-dim { position: absolute; inset: 0; z-index: 28; background: rgba(40,40,60,0.12); backdrop-filter: blur(10px) saturate(1.1); }
  .held { position: absolute; z-index: 29; box-shadow: 0 18px 50px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.12); }
  .menu { position: absolute; z-index: 29; width: 260px; border-radius: 26px; padding: 6px 0; background: rgba(250,250,252,0.86);
    backdrop-filter: blur(10px) saturate(1.6); box-shadow: 0 18px 50px rgba(0,0,0,0.22), inset 0 0 0 0.5px rgba(0,0,0,0.06); }
  .menu .item { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 18px; font-size: 17px; }
  .menu .item .ico { width: 20px; font-size: 17px; }
  .menu .sep { height: 1px; margin: 5px 18px; background: var(--separator); }

  /* The Home Screen widgets (GamesWidget.swift), and the app's icon beside them */
  html.art, html.art body { background: transparent; }
  .widgets { position: absolute; left: 0; top: 0; padding: 8px; display: flex; flex-direction: column; gap: 30px; width: 380px; }
  .wrow { display: flex; align-items: flex-start; }
  .widget { border-radius: 24px; overflow: hidden; position: relative; isolation: isolate; color: #fff; }
  .wbg { position: absolute; inset: 0; z-index: -1; }
  .wbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom right, rgba(255,255,255,0.14), rgba(0,0,0,0.2)); }
  .wmedium { width: 364px; height: 170px; padding: 16px; display: flex; gap: 8px; background: #EFEFF0; }
  .wsmall { width: 170px; height: 170px; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
  .wsmall .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .wsym { width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 19px; }
  .wsmall .wplay { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 10px; padding-left: 1px; }
  .wsmall .space { flex: 1; min-height: 6px; }
  .wsmall .k { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.8; line-height: 13px; }
  .wsmall b { font-size: 20px; font-weight: 700; line-height: 24px; }
  .wsmall .st { font-size: 12px; font-weight: 600; line-height: 15px; font-variant-numeric: tabular-nums; }
  .wsmall small { font-size: 11px; line-height: 13px; opacity: 0.85; white-space: nowrap; }
  .wtile { flex: 1; min-width: 0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .wtile .wsym { width: 30px; height: 30px; border-radius: 9px; font-size: 15px; }
  .wtile .space { flex: 1; min-height: 4px; }
  .wtile b { font-size: 15px; font-weight: 700; line-height: 19px; }
  .wtile .v { font-size: 17px; font-weight: 600; line-height: 21px; font-variant-numeric: tabular-nums; }
  .wtile .l { font-size: 11px; line-height: 13px; opacity: 0.85; }
  .wtile small { font-size: 10px; font-weight: 500; line-height: 12px; opacity: 0.8; white-space: nowrap; }
  .appicon { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
  .appicon img { width: 64px; height: 64px; display: block; }
  .appicon span { font-size: 12px; font-weight: 500; color: #fff; letter-spacing: 0; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'home';
const device = q.get('device') || 'phone';
document.body.className = device;

const icon = (name, style = '') => {
  const [w, h, d] = ICONS[name];
  return `<svg class="ico" viewBox="0 0 ${w} ${h}" style="${style}"><path d="${d}"/></svg>`;
};
const fmt = n => n.toLocaleString('en-US');

// Demo players. Pictures are emoji on a gradient, so no real person's photo
// ends up on the App Store.
const P = {
  mateo:  ['🦊', '#FFB36B', '#FF6A3D'],
  luna:   ['🐼', '#C9D6FF', '#8EA2FF'],
  carla:  ['🐸', '#B8F28C', '#3FB56B'],
  paco:   ['🐙', '#FFC2E2', '#FF6FB1'],
  sofi:   ['🦄', '#E5CCFF', '#A46BFF'],
  dougie: ['🐯', '#FFE08A', '#FFB020'],
  ari:    ['🐨', '#D7E3EA', '#9AB0BE'],
  nico:   ['🐵', '#F3D2B3', '#C88B5A'],
  jules:  ['🐳', '#B5E8FF', '#3BA7F5'],
  bea:    ['🐝', '#FFF1A8', '#F5C400'],
  kiki:   ['🐧', '#DDE6FF', '#7C93C8'],
};
const avatar = (who, size, extra = '') => {
  const [e, a, b] = P[who];
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.56)}px;background:linear-gradient(145deg,${a},${b});${extra}">${e}</div>`;
};

// The Wi-Fi glyph: three bands of the same weight fanning out from one point,
// the innermost a filled wedge, as iOS draws it. Worked out rather than traced,
// so the bands match. Slightly rounded corners, from a stroke in the same colour.
const wifi = (() => {
  const cx = 8.5, cy = 11.6, from = -135 * Math.PI / 180, to = -45 * Math.PI / 180;
  const pt = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
  const band = (inner, outer) => inner === 0
    ? `M${cx},${cy}L${pt(outer, from)}A${outer},${outer} 0 0 1 ${pt(outer, to)}Z`
    : `M${pt(outer, from)}A${outer},${outer} 0 0 1 ${pt(outer, to)}L${pt(inner, to)}A${inner},${inner} 0 0 0 ${pt(inner, from)}Z`;
  const d = band(0, 3.1) + band(5.0, 7.1) + band(9.0, 11.1);
  return `<svg width="17" height="12" viewBox="0 0 17 12"><path d="${d}" stroke="#000" stroke-width="0.5" stroke-linejoin="round"/></svg>`;
})();

const statusBar = () => device === 'phone'

// 30 days of lifetime spins, for the Spin Progress chart.
function spinChart(W) {
  const days = 30, end = 83254, gained = 4812;
  let pts = [], total = end - gained, seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const daily = Array.from({ length: days }, (_, i) => 40 + rnd() * 260 + (i > 18 ? 140 : 0) + (i % 7 === 5 ? 120 : 0));
  const k = gained / daily.reduce((a, b) => a + b, 0);
  for (let i = 0; i < days; i++) { total += daily[i] * k; pts.push(total); }
  const H = 220, lo = Math.min(...pts) - 600, hi = Math.max(...pts) + 300;
  const x = i => (i / (days - 1)) * (W - 70), y = v => H - 26 - ((v - lo) / (hi - lo)) * (H - 40);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [80000, 81500, 83000].map(v => `<line x1="0" x2="${W - 70}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(60,60,67,.18)" stroke-dasharray="4 5"/>
    <text x="${W - 62}" y="${y(v) + 4}" font-size="11" fill="rgba(60,60,67,.6)">${(v / 1000).toFixed(1).replace('.0', '')}K</text>`).join('');
  // AxisMarks(preset: .aligned): each date starts at its day's line, so the
  // first isn't cut off at the edge.
  const labels = ['Sep 13', 'Sep 20', 'Sep 27', 'Oct 4', 'Oct 11'].map((t, i) => `<line x1="${x(i * 7)}" x2="${x(i * 7)}" y1="0" y2="${H - 26}" stroke="rgba(60,60,67,.1)"/>
    <text x="${x(i * 7) + 2}" y="${H}" font-size="11" fill="rgba(60,60,67,.6)">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FB9FF" stop-opacity=".38"/><stop offset="1" stop-color="#4FB9FF" stop-opacity=".02"/></linearGradient></defs>
    ${ticks}
    <path d="${line}L${x(days - 1)},${H - 26}L0,${H - 26}Z" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="#4FB9FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${labels}
  </svg>`;
}

const squircle = (() => {
  const pts = [];
  for (let i = 0; i < 144; i++) {
    const t = (i / 144) * 2 * Math.PI, c = Math.cos(t), s = Math.sin(t);
    const x = Math.sign(c) * Math.abs(c) ** (2 / 5), y = Math.sign(s) * Math.abs(s) ** (2 / 5);
    pts.push(`${(50 + 50 * x).toFixed(2)}% ${(50 + 50 * y).toFixed(2)}%`);
  }
  return `polygon(${pts.join(',')})`;
})();

// BalancedGrid: as many columns as fit at its least width, but rows of
// even length: six tiles in room for five are two rows of three.
document.querySelectorAll('.balanced').forEach(grid => {
  const min = +grid.dataset.min, gap = +grid.dataset.gap, count = grid.children.length;
  const fit = Math.max(1, Math.floor((grid.clientWidth + gap) / (min + gap)));
  const rows = Math.ceil(count / fit);
  grid.style.gridTemplateColumns = `repeat(${Math.ceil(count / rows)}, minmax(0, 1fr))`;
});

// MasonryColumns: up to two columns at least 340 wide, each card going to
// the shorter one so far.
document.querySelectorAll('.masonry').forEach(box => {
  const gap = 16, cards = [...box.children];
  const n = Math.max(1, Math.min(2, Math.floor((box.clientWidth + gap) / (340 + gap))));
  box.style.cssText = `display:flex;gap:${gap}px;align-items:flex-start`;
  const columns = Array.from({ length: n }, () => {
    const column = document.createElement('div');
    column.style.cssText = `flex:1;min-width:0;display:flex;flex-direction:column;gap:${gap}px`;
    return box.appendChild(column);
  });
  for (const card of cards) columns.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).appendChild(card);
});

// The chart is drawn at the width its card ended up, so its labels aren't stretched.
document.querySelectorAll('.chart').forEach(c => { c.innerHTML = spinChart(c.clientWidth); });

// Text that shrinks to one line where it doesn't fit (minimumScaleFactor).
document.querySelectorAll('.fit').forEach(el => {
  const room = el.parentElement.clientWidth - 20;
  if (el.scrollWidth > room) el.style.fontSize = `${Math.max(8, 10 * room / el.scrollWidth).toFixed(2)}px`;
});

// The iPad's Games tab: the game played last held down, its menu open.
if (screen === 'games' && device === 'pad') {
  const card = document.querySelector(`.gcard[data-game="${LAST.key}"]`), r = card.getBoundingClientRect();
  const held = card.cloneNode(true);
  held.classList.add('held');
  Object.assign(held.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  document.body.insertAdjacentHTML('beforeend', '<div class="held-dim"></div>');
  document.body.appendChild(held);
  document.body.insertAdjacentHTML('beforeend', heldMenu(LAST));
  Object.assign(document.querySelector('.menu').style, { left: `${r.left}px`, top: `${r.bottom + 14}px` });
}
