# Builds the iOS app and runs its unit tests whenever anything under ios/
# changes. Unsigned: signing and App Store uploads happen from Xcode.

name: iOS

on:
  push:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
    - uses: actions/checkout@v5

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate the Xcode project
      run: xcodegen generate

    # Whichever iPhone and iPad simulators this runner's Xcode ships with
    # (the largest iPad there is), rather than hard-coded model names that
    # disappear with the next Xcode update.
    - name: Pick simulators
      id: sim
      run: |
        xcrun simctl list devices available --json | python3 -c '
        import json, sys
        devices = json.load(sys.stdin)["devices"]
        def pick(*prefixes):
            for prefix in prefixes:
                for runtime, items in sorted(devices.items(), reverse=True):
                    for device in items:
                        if "iOS" in runtime and device["name"].startswith(prefix):
                            return device["udid"]
            sys.exit("No simulator named " + " or ".join(prefixes))
        print("iphone=" + pick("iPhone"))
        print("ipad=" + pick("iPad Pro 13", "iPad Pro", "iPad Air 13", "iPad"))
        ' >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        set -o pipefail
        xcodebuild build-for-testing \
          -project Empanadas.xcodeproj \
          -scheme Empanadas \
          -destination "id=${{ steps.sim.outputs.iphone }}" \
          CODE_SIGNING_ALLOWED=NO

    # Both runs also draw the native screens with a made-up account
    # (EmpanadasTests/ScreenshotTests.swift): the iPhone's screen, and on the
    # iPad its screen both ways round, Split View and a wide Mac window.
    - name: Test on an iPhone
      env:
        TEST_RUNNER_SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
      run: |
        set -o pipefail
        xcodebuild test-without-building \
          -project Empanadas.xcodeproj \
          -scheme Empanadas \
          -destination "id=${{ steps.sim.outputs.iphone }}" \
          CODE_SIGNING_ALLOWED=NO

    - name: Test on an iPad
      env:
        TEST_RUNNER_SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
      run: |
        set -o pipefail
        xcodebuild test-without-building \
          -project Empanadas.xcodeproj \
          -scheme Empanadas \
          -destination "id=${{ steps.sim.outputs.ipad }}" \
          CODE_SIGNING_ALLOWED=NO

    # Pictures to look at, not a check: a full artifact storage quota fails
    # the upload, and that should not turn a passing build and test run red.
    - name: Upload the screenshots
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: ${{ runner.temp }}/screenshots
        if-no-files-found: warn
        retention-days: 7
